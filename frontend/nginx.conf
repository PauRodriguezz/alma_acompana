server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API del back. El límite coincide con spring.servlet.multipart.max-request-size (3MB):
    # las imágenes pueden pesar hasta 2 MB y, si nginx cortara antes, la persona vería un 413
    # de nginx en vez del mensaje del back.
    location /api/ {
        client_max_body_size 3m;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El modelo puede tardar hasta 30 s por llamada (alma.ia.timeout-llamada-ms): nginx espera más.
        proxy_read_timeout 90s;
    }

    # Imágenes subidas desde el panel: las sirve el back (ya manda su propio Cache-Control).
    location /imagenes/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Archivos con hash en el nombre (Vite): se pueden cachear por mucho tiempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: cualquier otra ruta devuelve index.html, que no se cachea.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
