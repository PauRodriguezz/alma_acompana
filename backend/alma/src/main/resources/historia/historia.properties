# Parámetros de la historia de vida (docs/contrato-grafo.md, secciones 5.8 y 10).
# Se leen como UTF-8 (ConfiguracionHistoria).
# --- Límites (5.8) ---
# Máximo de caracteres del texto de una respuesta.
alma.historia.texto-max=1000

# --- Extracción de recuerdos (5.4) ---
# Parámetros propios de cada llamada al modelo (el chat conserva los suyos, en chat.properties).
alma.historia.extraccion-temperatura=0.1
alma.historia.extraccion-max-tokens=600
# Máximo de una llamada de extracción, en milisegundos (lo usa el segundo cliente de ia/).
alma.ia.timeout-extraccion-ms=25000
