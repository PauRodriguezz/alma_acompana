# Parámetros de la historia de vida (docs/contrato-grafo.md, secciones 5.8 y 10).
# Se leen como UTF-8 (ConfiguracionHistoria).
# --- Límites (5.8) ---
# Máximo de caracteres del texto de una respuesta.
alma.historia.texto-max=1000
# Máximo de veces que se pregunta por cada dato de un recuerdo (5.7).
alma.historia.intentos-max=2

# --- Línea de tiempo (contrato de historia de vida, 7.3) ---
# Largo máximo del resumen de cada recuerdo en el listado (se corta con "…").
alma.historia.resumen-max=140

# --- Recuerdos en el prompt del chat (contrato de historia de vida, 5.5 y 10.5) ---
# Tope de tiempo (ms) de la lectura del grafo para el prompt del chat (progreso y recuerdos juntos). Si se pasa, el
# chat sigue con "No hay información." sin esperar más (Neo4j caído, red lenta o consulta trabada).
alma.historia.lectura-chat-timeout-ms=2000
# Máximo de esas lecturas a la vez. Con todas ocupadas se rechaza de inmediato: el mensaje no espera.
alma.historia.lectura-chat-hilos-max=4
# Máximo de recuerdos que se agregan a {recuerdos}.
alma.historia.max-recuerdos-prompt=3
# Largo máximo de la descripción de cada recuerdo en el prompt (se corta con "…").
alma.historia.descripcion-prompt-max=300
# Frases (sin tildes, en minúscula, separadas por coma) que traen los recuerdos de esa etapa de vida. VEJEZ no tiene:
# es la etapa actual de la persona y no aporta contexto de recuerdo.
alma.historia.frases-etapa.infancia=de chica,de chico,cuando era chica,cuando era chico,de nina,de nino,cuando era nina,cuando era nino
alma.historia.frases-etapa.adolescencia=de adolescente,cuando era adolescente
alma.historia.frases-etapa.juventud=de joven,cuando era joven,cuando era jovencita,cuando era jovencito
alma.historia.frases-etapa.adultez=de adulta,de adulto,cuando era adulta,cuando era adulto

# --- Extracción de recuerdos (5.4) ---
# Parámetros propios de cada llamada al modelo (el chat conserva los suyos, en chat.properties).
alma.historia.extraccion-temperatura=0.1
alma.historia.extraccion-max-tokens=800
# Error transitorio del proveedor (503, 429, 500, 502, 504): se repite el pedido una vez, y ese reintento usa el segundo
# de los dos pedidos de la extracción. Espera antes de repetir (ms) y límite de tiempo desde el primer pedido: si ya
# pasó más, no se reintenta.
alma.historia.extraccion-reintento-espera-ms=1500
alma.historia.extraccion-reintento-hasta-ms=25000
# Máximo de una llamada de extracción, en milisegundos (lo usa el segundo cliente de ia/).
alma.ia.timeout-extraccion-ms=25000
