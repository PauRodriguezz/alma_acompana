# Textos, listas y parámetros del chat con Alma (docs/contrato-chat.md, secciones 2, 5.3, 5.6, 6.2 y 6.3).
# Se leen como UTF-8 (ConfiguracionChat). En este formato la barra invertida es un carácter de escape:
# por eso las expresiones regulares de 6.3 llevan \\b y \\w, que se cargan como \b y \w.

# --- Respuestas predefinidas (6.2): se muestran tal cual, sin que intervenga el modelo ---
alma.chat.respuestas.urgencia=Lo que me contás puede ser urgente. Por favor, llamá ahora al 911 o pedile a alguien que esté cerca que te ayude. Yo no puedo evaluar lo que te pasa, pero ellos sí.
alma.chat.respuestas.malestar-grave=Gracias por contármelo. Lo que sentís es importante y no tenés que atravesarlo sin compañía. Podés llamar gratis a la Línea de Salud Mental 0800-999-0091, a cualquier hora, o al Centro de Asistencia al Suicida 0800-345-1435. Si estás en peligro, llamá al 911. Si podés, contáselo también a alguien de tu confianza que esté cerca.

# --- Límites (5.9 y 5.5) ---
alma.chat.limites.mensaje-max=500
alma.chat.limites.texto-conversacion-max=2000
alma.chat.limites.turnos-max=10

# --- Modelo (5.6) ---
alma.ia.temperatura=0.6
alma.ia.max-tokens=400
# Máximo de una llamada al modelo y espera máxima por un turno (un pedido a la vez), en milisegundos.
alma.ia.timeout-llamada-ms=30000
alma.ia.espera-turno-ms=10000

# --- Malestar emocional grave (6.3) ---
alma.chat.guardrails.malestar[0]=no quiero (seguir )?viv(ir|iendo)(?! (en|con|lejos|cerca|sola|solo|aca|alla|ahi)\\b)
alma.chat.guardrails.malestar[1]=no vale la pena (seguir )?viv\\w+
alma.chat.guardrails.malestar[2]=quiero desaparecer
alma.chat.guardrails.malestar[3]=(quiero|quisiera|queria) morirme(?! de (risa|verguenza|calor|hambre|sueno|frio|ganas|envidia|miedo))
alma.chat.guardrails.malestar[4]=me quiero morir(?!me)(?! de (risa|verguenza|calor|hambre|sueno|frio|ganas|envidia|miedo))
alma.chat.guardrails.malestar[5]=ojala (me muera|no despertar|no me despierte)
alma.chat.guardrails.malestar[6]=quitarme la vida
alma.chat.guardrails.malestar[7]=suicid\\w+
alma.chat.guardrails.malestar[8]=(quiero|voy a|pienso) matarme
alma.chat.guardrails.malestar[9]=me voy a matar
alma.chat.guardrails.malestar[10]=(acabar|terminar) con mi vida
alma.chat.guardrails.malestar[11]=(hacerme|me quiero hacer) dano
alma.chat.guardrails.malestar[12]=lastimarme
alma.chat.guardrails.malestar[13]=cortarme las venas

# --- Urgencias médicas (6.3) ---
alma.chat.guardrails.urgencias[0]=dolor\\w*( \\w+){0,4} pecho
alma.chat.guardrails.urgencias[1]=duel\\w*( \\w+){0,2} pecho
alma.chat.guardrails.urgencias[2]=pecho( \\w+){0,3} (duele|dolor|aprieta|oprime)
alma.chat.guardrails.urgencias[3]=falta\\w* (el )?(aire|aliento)(?! acondicionado)
alma.chat.guardrails.urgencias[4]=no (puedo|logro) respirar
alma.chat.guardrails.urgencias[5]=no (me )?(entra|llega) (el )?aire
alma.chat.guardrails.urgencias[6]=me (ahogo|estoy ahogando|asfixio)
alma.chat.guardrails.urgencias[7]=me cuesta (mucho )?respirar
alma.chat.guardrails.urgencias[8]=me (desmaye|desmayo|desvaneci|estoy desmayando)
alma.chat.guardrails.urgencias[9]=(perdi|pierdo|perdiendo) (el )?conocimiento
alma.chat.guardrails.urgencias[10]=(golpe\\w*|pegue|pegado)( \\w+){0,3} (la )?cabeza
alma.chat.guardrails.urgencias[11]=me cai\\w*( \\w+){0,6} cabeza
alma.chat.guardrails.urgencias[12]=me tome( \\w+){0,4} (pastilla\\w*|remedio\\w*|medicacion|comprimido\\w*|calmante\\w*|medicamento\\w*)( \\w+){0,4} de mas
alma.chat.guardrails.urgencias[13]=sobredosis
alma.chat.guardrails.urgencias[14]=(de repente|de golpe)( \\w+){0,3} confundid\\w+
alma.chat.guardrails.urgencias[15]=no se donde estoy
