spring.application.name=alma

# Lee el .env de la raíz cuando el backend corre desde el IDE o con Maven.
# Dentro de Docker no existe y se ignora (las variables llegan por el compose).
spring.config.import=optional:file:.env[.properties],optional:file:../../.env[.properties]

# --- Servidor ---
server.port=8080
spring.jackson.time-zone=America/Argentina/Buenos_Aires

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:alma}
spring.datasource.username=${POSTGRES_USER:alma}
spring.datasource.password=${POSTGRES_PASSWORD}

# --- JPA y Flyway (el esquema lo crea Flyway, no Hibernate) ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false


# --- Neo4j ---
spring.neo4j.uri=bolt://${NEO4J_HOST:localhost}:${NEO4J_PORT:7687}
spring.neo4j.authentication.username=${NEO4J_USER:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD}

# --- Ollama (Spring AI) ---
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:gemma4:cloud}
spring.ai.ollama.init.pull-model-strategy=never

# --- JWT propio del MVP ---
alma.security.jwt.secret=${JWT_SECRET}
alma.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# --- Actuator ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
