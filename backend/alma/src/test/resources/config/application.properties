# Solo para las pruebas. Está en config/ (no en la raíz) para sumarse a application.properties sin taparlo.
# Los calentamientos de arranque (Neo4j y Gemini) no tienen que correr en cada contexto de prueba: las pruebas
# propias de cada calentamiento llaman a calentar() directamente.
alma.historia.calentar-neo4j=false
alma.ia.gemini.calentar=false
